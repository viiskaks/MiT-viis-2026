# /etc/nginx/sites-available/mit-viis-2026
# Replace mentor.example.com with your real domain before enabling.
server {
    listen 80;
    listen [::]:80;
    server_name mentor.example.com;

    root /var/www/mit-viis-2026/current;
    index index.html;

    # Hashed Vite assets are shared between releases, including rollbacks.
    location /assets/ {
        alias /var/www/mit-viis-2026/shared/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hash navigation stays in the browser; a missing file should return 404.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /deployment.txt {
        add_header Cache-Control "no-store" always;
    }
}
